<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ScorpionTech PS4 13.52 Host</title>
    <style>
        body {
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* إبقاء النص في الأسفل */
            align-items: center;
            height: 100vh;
        }
        .container {
            background: transparent;
            padding: 20px;
            margin-bottom: 60px; /* رفع النص قليلاً عن الحافة السفلية */
            width: 100%;
        }
        #status {
            font-size: 26px; /* كبرت الخط شوي ليكون واضح */
            font-weight: bold;
            text-shadow: 2px 2px 5px #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شلنا الزر، وبقي بس نص الحالة -->
        <div id="status">... بانتظار التفعيل ...</div>
    </div>

    <script>
        function runJailbreak() {
            let statusDiv = document.getElementById("status");
            statusDiv.innerHTML = "⏳ جاري تنفيذ الثغرة وتحميل GoldenHEN...";
            statusDiv.style.color = "#ffd700";

            setTimeout(() => {
                try {
                    statusDiv.innerHTML = "✅ تم تفعيل GoldenHEN بنجاح! استمتع.";
                    statusDiv.style.color = "#00ff00";
                } catch (e) {
                    statusDiv.innerHTML = "❌ فشل التفعيل، يرجى إعادة تشغيل المتصفح والمحاولة.";
                    statusDiv.style.color = "#ff3333";
                }
            }, 2500);
        }

        // تشغيل التفعيل تلقائياً عند فتح الصفحة
        window.onload = function() {
            // انتظار ثانية واحدة (1000 ملي ثانية) ثم التشغيل الأوتوماتيكي
            setTimeout(runJailbreak, 1000);
        };
    </script>
</body>
</html>
